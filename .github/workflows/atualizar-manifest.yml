name: Atualizar manifest.json

on:
  push:
    branches:
      - main
    paths:
      - "dados/*.json"
      - "!dados/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-manifest:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Atualizar manifesto
        run: node scripts/atualizar-manifest.js

      - name: Salvar manifesto
        run: |
          if git diff --quiet -- dados/manifest.json; then
            echo "Manifesto já está atualizado."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/manifest.json
          git commit -m "Atualizar manifest.json automaticamente"
          git push
